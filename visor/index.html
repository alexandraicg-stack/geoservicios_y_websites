<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor Territorial de Colombia</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Visor Territorial de Colombia</h1>
        <p>Departamentos y municipios | Servicios SIG</p>
    </header>

    <main class="visor-layout">

        <!-- MENU RESPONSIVE V4 -->
        <button
            id="boton-menu"
            type="button"
            aria-controls="panel-territorial"
            aria-expanded="false"
            aria-label="Abrir o cerrar consultas territoriales"
        >
            &#9776; Consultas
        </button>

        <aside id="panel-territorial">

            <h2>Consulta territorial</h2>
            <p>Explora los municipios de Colombia</p>

            <label for="filtro-departamento">
    Seleccionar departamento
</label>

<select id="filtro-departamento">
    <option value="">Todos los departamentos</option>
</select>

<div id="estadisticas-territoriales"></div>
<label for="buscar-municipio">
                Buscar municipio
            </label>

            <input
                type="search"
                id="buscar-municipio"
                placeholder="Ej. Anapoima, Medellín..."
                autocomplete="off"
            >

            <div id="resultados-busqueda"></div>

            <section id="ficha-territorial">
                <h3>Información municipal</h3>
                <p>Selecciona un municipio para consultar sus datos.</p>
            </section>

        </aside>

        <div id="map"></div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
    <script src="js/bibliotecas-cali.js"></script>

</body>
</html>
